plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.iammaplezeng.flowmeter'
    compileSdk 37

    defaultConfig {
        applicationId "io.github.iammaplezeng.flowmeter"
        minSdk 26
        targetSdk 37
        versionCode 8
        versionName "1.7"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
