plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jsiot.flowmeter'
    compileSdk 37

    defaultConfig {
        applicationId "com.jsiot.flowmeter"
        minSdk 26
        targetSdk 37
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
